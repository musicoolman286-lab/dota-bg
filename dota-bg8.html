<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>bg</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    video {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      /* Заполняет весь экран, сохраняя пропорции */
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!--
    ИНСТРУКЦИЯ:
    1. Загрузи своё видео (.mp4) рядом с этим файлом на GitHub
    2. Замени "video8.mp4" на имя своего файла
    3. Или вставь прямую ссылку на mp4 в src=""
  -->
  <video
    src="video8.mp4"
    autoplay
    loop
    muted
    playsinline
    preload="auto"
  ></video>

</body>
</html>
